<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de Complementos IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.25/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --ink:#10151B;
    --canvas:#F0F2ED;
    --surface:#FFFFFF;
    --line:#DBE0D8;
    --line-soft:#EAEDE6;
    --muted:#57616C;
    --muted-2:#818B84;
    --brand:#0C7A63;
    --brand-dark:#075A48;
    --brand-tint:#DCF2EA;
    --danger:#C0281D;
    --danger-tint:#FBDDD8;
    --warning:#946200;
    --warning-tint:#FCEBC4;
    --ok:#137A45;
    --ok-tint:#D8F2E1;
    --accent-purple:#5B3EC9;
    --accent-purple-tint:#E6E0FB;
    --accent-pink:#B7247A;
    --accent-pink-tint:#FBDDEC;
    --radius-s:6px;
    --radius-m:10px;
    --font-ui:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F1F4EF; --canvas:#0A0F0D; --surface:#121A17; --line:#28352E; --line-soft:#1B2521;
      --muted:#A7B3AB; --muted-2:#7C8981; --brand:#2FE0B8; --brand-dark:#22B394; --brand-tint:#0E3A30;
      --danger:#FF6B5E; --danger-tint:#401D18; --warning:#FFCC55; --warning-tint:#3A2A05;
      --ok:#5FE39A; --ok-tint:#0E3A24;
      --accent-purple:#B3A0FF; --accent-purple-tint:#2A2258; --accent-pink:#FF9BD6; --accent-pink-tint:#4A1B36;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F1F4EF; --canvas:#0A0F0D; --surface:#121A17; --line:#28352E; --line-soft:#1B2521;
    --muted:#A7B3AB; --muted-2:#7C8981; --brand:#2FE0B8; --brand-dark:#22B394; --brand-tint:#0E3A30;
    --danger:#FF6B5E; --danger-tint:#401D18; --warning:#FFCC55; --warning-tint:#3A2A05;
    --ok:#5FE39A; --ok-tint:#0E3A24;
    --accent-purple:#B3A0FF; --accent-purple-tint:#2A2258; --accent-pink:#FF9BD6; --accent-pink-tint:#4A1B36;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:var(--font-ui); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--brand); color:#fff; }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

  /* ---------- App shell ---------- */
  #app{ display:flex; min-height:100%; }

  .sidebar{
    width:248px; flex:0 0 248px; background:var(--ink); color:var(--canvas);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    padding:20px 14px; gap:4px;
  }
  .brand{
    display:flex; align-items:center; gap:10px; padding:6px 10px 18px;
  }
  .brand-mark{
    width:30px; height:30px; border-radius:8px; background:var(--brand);
    display:flex; align-items:center; justify-content:center; flex:0 0 30px;
  }
  .brand-mark svg{ width:16px; height:16px; }
  .brand-text{ line-height:1.2; }
  .brand-text .t1{ font-weight:600; font-size:14.5px; letter-spacing:.1px; }
  .brand-text .t2{ font-size:11.5px; color:#9BA79F; }

  .nav-group-label{ font-size:11px; color:#7C887F; padding:14px 12px 6px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
    color:#D8DED8; text-decoration:none; cursor:pointer; font-size:13.5px; font-weight:500;
    border:none; background:transparent; width:100%; text-align:left;
  }
  .nav-item svg{ width:17px; height:17px; flex:0 0 17px; opacity:.85; }
  .nav-item:hover{ background:#1E2A25; color:#fff; }
  .nav-item.active{ background:var(--brand); color:#fff; }
  .nav-item .count{
    margin-left:auto; font-family:var(--font-mono); font-size:11px; color:#9BA79F;
    background:#1E2A25; padding:1px 7px; border-radius:20px;
  }
  .nav-item.active .count{ background:rgba(255,255,255,.22); color:#fff; }
  .nav-item.danger .count{ background:var(--danger); color:#fff; }

  .sidebar-foot{ margin-top:auto; padding:10px 12px; font-size:11.5px; color:#7C887F; border-top:1px solid #232F29; padding-top:14px;}

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .topbar{
    position:sticky; top:0; z-index:5; background:var(--canvas);
    display:flex; align-items:center; gap:14px; padding:16px 28px; border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);
  }
  .topbar h1{ font-size:18px; margin:0; font-weight:600; letter-spacing:-.1px; }
  .topbar .period-chip{
    font-family:var(--font-mono); font-size:12px; color:var(--brand-dark); background:var(--brand-tint);
    padding:4px 10px; border-radius:20px; font-weight:500;
  }
  .search-wrap{ margin-left:auto; position:relative; width:280px; max-width:40vw; }
  .search-wrap input{
    width:100%; padding:8px 12px 8px 32px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:13px;
  }
  .search-wrap svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted-2); }

  .menu-btn{ display:none; }

  .theme-toggle{
    display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--muted); flex:0 0 34px;
  }
  .theme-toggle:hover{ background:var(--canvas); color:var(--ink); border-color:var(--brand); }
  .theme-toggle svg{ width:17px; height:17px; }
  .theme-toggle .ic-sun{ display:none; }
  .theme-toggle .ic-moon{ display:block; }
  :root[data-theme="dark"] .theme-toggle .ic-sun{ display:block; }
  :root[data-theme="dark"] .theme-toggle .ic-moon{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .ic-sun{ display:block; }
    :root:not([data-theme="light"]) .theme-toggle .ic-moon{ display:none; }
  }

  .view{ padding:24px 28px 60px; max-width:1180px; }
  .view h2{ font-size:20px; margin:0 0 4px; font-weight:600; letter-spacing:-.2px; }
  .view .lede{ color:var(--muted); font-size:13.5px; margin:0 0 22px; max-width:640px; }

  /* ---------- KPI cards ---------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:16px 18px;
  }
  .kpi .label{ font-size:12px; color:var(--muted); margin-bottom:8px; }
  .kpi .value{ font-family:var(--font-mono); font-size:23px; font-weight:600; letter-spacing:-.5px; }
  .kpi .value.danger{ color:var(--danger); }
  .kpi .sub{ font-size:11.5px; color:var(--muted-2); margin-top:4px; }

  /* ---------- Panels / sections ---------- */
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); margin-bottom:20px; overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line-soft); }
  .panel-head h3{ margin:0; font-size:14.5px; font-weight:600; }
  .panel-body{ padding:16px 18px; }

  /* ---------- Filter bar ---------- */
  .filter-bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .filter-bar select, .filter-bar input[type=text]{
    padding:7px 10px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:12.5px;
  }
  .filter-bar .spacer{ flex:1; }
  .filter-count{ font-size:12px; color:var(--muted); white-space:nowrap; }

  /* ---------- Table ---------- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  thead th{
    text-align:left; padding:10px 14px; font-size:11.5px; color:var(--muted); font-weight:600;
    border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; background:var(--surface); cursor:pointer;
  }
  thead th:hover{ color:var(--ink); }
  tbody td{ padding:10px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle; white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--canvas); }
  td.num, th.num{ text-align:right; font-family:var(--font-mono); }
  .name-cell{ display:flex; flex-direction:column; }
  .name-cell .nm{ font-weight:500; }
  .name-cell .dni{ font-size:11px; color:var(--muted-2); font-family:var(--font-mono); }

  .tag{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:3px 9px; border-radius:20px; font-weight:500; }
  .tag-enf{ background:var(--brand-tint); color:var(--brand-dark); }
  .tag-acc{ background:var(--accent-purple-tint); color:var(--accent-purple); }
  .tag-mat{ background:var(--accent-pink-tint); color:var(--accent-pink); }
  .tag-ok{ background:var(--ok-tint); color:var(--ok); }
  .tag-warn{ background:var(--warning-tint); color:var(--warning); }
  .tag-danger{ background:var(--danger-tint); color:var(--danger); }
  .tag-muted{ background:var(--line-soft); color:var(--muted); }

  .empty-state{ padding:50px 20px; text-align:center; color:var(--muted); }
  .empty-state svg{ width:34px; height:34px; margin-bottom:10px; opacity:.5; }

  /* ---------- Landing (empty state) ---------- */
  .landing{ min-height:calc(100vh - 40px); display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .landing-card{ max-width:640px; width:100%; text-align:center; }
  .landing-mark{ width:56px; height:56px; border-radius:14px; background:var(--brand); display:flex; align-items:center; justify-content:center; margin:0 auto 22px; }
  .landing-card h2{ font-size:24px; margin:0 0 10px; font-weight:600; letter-spacing:-.3px; }
  .landing-card p{ color:var(--muted); font-size:14px; max-width:440px; margin:0 auto 32px; }
  .landing-actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .landing-btn{
    display:flex; flex-direction:column; align-items:center; gap:10px; width:210px; padding:26px 18px;
    border-radius:var(--radius-m); border:1px solid var(--line); background:var(--surface); cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .landing-btn:hover{ border-color:var(--brand); }
  .landing-btn:active{ transform:scale(.98); }
  .landing-btn .ic{ width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--brand-tint); color:var(--brand-dark); }
  .landing-btn.secondary .ic{ background:var(--line-soft); color:var(--muted); }
  .landing-btn .t{ font-weight:600; font-size:13.5px; }
  .landing-btn .s{ font-size:11.5px; color:var(--muted-2); }
  .landing-btn:disabled, .landing-btn[data-disabled="true"]{ opacity:.45; cursor:not-allowed; }
  .landing-foot{ margin-top:28px; font-size:12px; color:var(--muted-2); }

  /* ---------- Detail drawer ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(10,14,12,.42); z-index:20; opacity:0; pointer-events:none; transition:opacity .18s ease; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:600px; max-width:96vw; background:var(--surface);
    z-index:21; box-shadow:-12px 0 30px rgba(0,0,0,.18); transform:translateX(100%); transition:transform .22s ease;
    display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:20px 22px 14px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:12px; }
  .drawer-head .who{ flex:1; min-width:0; }
  .drawer-head .who .nm{ font-size:16px; font-weight:600; }
  .drawer-head .who .dni{ font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-top:2px; }
  .drawer-close{ border:none; background:var(--canvas); width:30px; height:30px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); flex:0 0 auto; }
  .drawer-close:hover{ background:var(--line-soft); color:var(--ink); }
  .drawer-body{ padding:18px 22px 40px; overflow-y:auto; flex:1; }
  .drawer-foot{
    padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center;
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  }
  .drawer-foot .spacer{ flex:1; }

  /* ---------- Editable form ---------- */
  .form-section{ margin-bottom:20px; }
  .form-section .fs-title{
    font-size:11.5px; font-weight:600; color:var(--muted); text-transform:none; letter-spacing:.2px;
    margin-bottom:10px; padding-bottom:7px; border-bottom:1px solid var(--line-soft);
    display:flex; justify-content:space-between; align-items:center;
  }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .field{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .field.span2{ grid-column:1/-1; }
  .field label{ font-size:11.5px; color:var(--muted); }
  .field input, .field select, .field textarea{
    padding:8px 10px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:13px; font-family:var(--font-ui); width:100%;
  }
  .field input.num-input, .field input[type=number]{ font-family:var(--font-mono); }
  .field input:disabled{ background:var(--canvas); color:var(--muted); }
  .field textarea{ font-family:var(--font-ui); resize:vertical; min-height:44px; }
  .field .hint{ font-size:10.5px; color:var(--muted-2); }
  .lookup-row{ display:flex; gap:8px; }
  .lookup-row input{ flex:1; }
  .btn-sm{ padding:8px 11px; font-size:12px; white-space:nowrap; }
  .badge-found{ display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--ok); margin-top:4px; }
  .badge-notfound{ display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--warning); margin-top:4px; }

  .live-result{
    position:sticky; top:0; z-index:2; background:var(--surface); padding-bottom:10px; margin-bottom:14px;
  }

  .kv-line{ display:flex; justify-content:space-between; gap:14px; padding:7px 0; font-size:13px; border-bottom:1px dashed var(--line-soft); }
  .kv-line .k{ color:var(--muted); }
  .kv-line .v{ font-family:var(--font-mono); font-weight:500; text-align:right; }

  .calc-step{ border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:12px; }
  .calc-step .title{ font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between; }
  .calc-step .formula{ font-family:var(--font-mono); font-size:12px; color:var(--muted-2); background:var(--canvas); padding:8px 10px; border-radius:7px; margin-top:8px; overflow-x:auto; }
  .result-banner{
    border-radius:var(--radius-m); padding:16px 18px; margin:16px 0 18px; display:flex; align-items:center; justify-content:space-between;
    background:var(--brand-tint); border:1px solid var(--brand);
  }
  .result-banner .lbl{ font-size:12.5px; color:var(--brand-dark); font-weight:600; }
  .result-banner .amt{ font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--brand-dark); }
  .result-banner.danger{ background:var(--danger-tint); border-color:var(--danger); }
  .result-banner.danger .lbl,.result-banner.danger .amt{ color:var(--danger); }
  .result-banner.muted{ background:var(--line-soft); border-color:var(--line); }
  .result-banner.muted .lbl,.result-banner.muted .amt{ color:var(--muted); }

  .warn-box{ display:flex; gap:10px; background:var(--warning-tint); border:1px solid #D9B65C; color:var(--warning); padding:12px 14px; border-radius:var(--radius-m); font-size:12.5px; margin-bottom:16px; }
  .warn-box svg{ flex:0 0 16px; width:16px; height:16px; margin-top:1px; }
  .err-box{ display:flex; gap:10px; background:var(--danger-tint); border:1px solid #E39C96; color:var(--danger); padding:12px 14px; border-radius:var(--radius-m); font-size:12.5px; margin-bottom:16px; }
  .err-box svg{ flex:0 0 16px; width:16px; height:16px; margin-top:1px; }

  /* ---------- Incidencias ---------- */
  .inc-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); margin-bottom:16px; overflow:hidden; }
  .inc-head{ padding:16px 18px; display:flex; align-items:flex-start; gap:14px; cursor:pointer; }
  .inc-sev{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:0 0 34px; }
  .inc-sev.high{ background:var(--danger-tint); color:var(--danger); }
  .inc-sev.mid{ background:var(--warning-tint); color:var(--warning); }
  .inc-sev.low{ background:var(--line-soft); color:var(--muted); }
  .inc-head .txt{ flex:1; }
  .inc-head .txt h4{ margin:0 0 3px; font-size:14px; font-weight:600; }
  .inc-head .txt p{ margin:0; font-size:12.5px; color:var(--muted); }
  .inc-head .metric{ text-align:right; }
  .inc-head .metric .n{ font-family:var(--font-mono); font-weight:700; font-size:15px; }
  .inc-head .metric .lbl2{ font-size:11px; color:var(--muted-2); }
  .inc-body{ border-top:1px solid var(--line-soft); padding:6px 0; display:none; }
  .inc-body.open{ display:block; }
  .inc-row{ display:flex; justify-content:space-between; gap:10px; padding:9px 18px; font-size:12.5px; border-bottom:1px solid var(--line-soft); align-items:center; }
  .inc-row:last-child{ border-bottom:none; }
  .inc-row .who{ min-width:0; }
  .inc-row .who .nm{ font-weight:500; }
  .inc-row .who .meta{ color:var(--muted-2); font-family:var(--font-mono); font-size:11px; }
  .inc-row .delta{ font-family:var(--font-mono); color:var(--danger); font-weight:600; white-space:nowrap; }
  .chev{ transition:transform .15s ease; color:var(--muted-2); flex:0 0 16px; }
  .chev.open{ transform:rotate(90deg); }

  .impact-banner{
    display:flex; align-items:center; gap:16px; background:var(--ink); color:var(--canvas); border-radius:var(--radius-m); padding:18px 22px; margin-bottom:22px;
  }
  .impact-banner .num-big{ font-family:var(--font-mono); font-size:28px; font-weight:700; }
  .impact-banner .txt{ font-size:12.5px; color:#B9C4BC; max-width:520px; }
  .impact-banner .txt strong{ color:#fff; }

  /* ---------- misc ---------- */
  .bar-chart{ display:flex; flex-direction:column; gap:10px; }
  .bar-row{ display:grid; grid-template-columns:130px 1fr 60px; align-items:center; gap:10px; font-size:12px; }
  .bar-row .lbl{ color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{ height:8px; background:var(--line-soft); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--brand); border-radius:6px; }
  .bar-row .val{ font-family:var(--font-mono); text-align:right; color:var(--muted); }

  .btn{ border:1px solid var(--line); background:var(--surface); padding:7px 13px; border-radius:7px; font-size:12.5px; font-weight:500; cursor:pointer; color:var(--ink); display:inline-flex; align-items:center; line-height:1.2; user-select:none; }
  .btn:hover{ background:var(--canvas); }
  .btn-primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-pdf{ background:#3B2E8C; border-color:#3B2E8C; color:#fff; }
  .btn-pdf:hover{ background:#2E2270; }
  .btn[disabled], .btn-pdf[disabled]{ opacity:.4; cursor:not-allowed; }

<script>
(function(){
  "use strict";

  /* ============================================================
     -1. THEME (light / dark), persisted per browser
  ============================================================ */
  (function initTheme(){
    let saved = null;
    try{ saved = localStorage.getItem('panelIT_theme'); }catch(e){ /* ignore */ }
    if (saved==='light' || saved==='dark') document.documentElement.setAttribute('data-theme', saved);
  })();
  function currentTheme(){
    const attr = document.documentElement.getAttribute('data-theme');
    if (attr==='light' || attr==='dark') return attr;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function toggleTheme(){
    const next = currentTheme()==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('panelIT_theme', next); }catch(e){ /* ignore */ }
  }
  const btnTheme = document.getElementById('btnTheme');
  if (btnTheme) btnTheme.addEventListener('click', toggleTheme);

  /* ============================================================
     0. CONSTANTS
  ============================================================ */
  const RATE_ANTIG = { TRAILER: 18.26, RIGIDO: 16.755 };
  const RIGIDO_CATS = [100,102,104,107];

  const SHEET_NAMES = {
    centro: 'CENTRO ANALISIS',
    sage: 'SAGE',
    tablaBase: 'TABLA BASE',
    cbe: 'CALCULO BASE ENF',
    complEnf: 'COMPL ENF',
    complAcc: 'COMPL ACC',
  };

  /* ============================================================
     1. GENERIC HELPERS
  ============================================================ */
  function num(x){ if (x===null||x===undefined||x==='') return 0; const n = typeof x==='number'? x : parseFloat(String(x).replace(',','.')); return Number.isFinite(n)? n : 0; }
  function isBlankOrError(x){ return x===null || x===undefined || x==='' || (typeof x==='string' && x.indexOf('#')===0); }
  function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtMoney(n){ if (n===null||n===undefined||Number.isNaN(n)) return '—'; return n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
  function fmtNum(n,dec){ if (n===null||n===undefined||Number.isNaN(n)) return '—'; return n.toLocaleString('es-ES',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||2}); }
  function round2(x){ return Math.round((x + (x>=0?1e-9:-1e-9)) * 100) / 100; }

  // Dates are kept as ISO 'YYYY-MM-DD' internally. A value stored as plain
  // TEXT in the source workbook (e.g. "10/07/2026") is preserved verbatim
  // and flagged — this mirrors a real formatting bug we found in the
  // original file, where Excel silently ignores such a cell in date math.
  function parseCell(raw){
    if (raw === null || raw === undefined || raw === '') return null;
    if (raw instanceof Date){ return { d: new Date(Date.UTC(raw.getFullYear(), raw.getMonth(), raw.getDate())), text:false, raw: isoOf(raw) }; }
    if (typeof raw === 'string' && raw.indexOf('/') !== -1){
      const [dd,mm,yy] = raw.split('/').map(Number);
      if (!dd||!mm||!yy) return null;
      return { d: new Date(Date.UTC(yy, mm-1, dd)), text:true, raw };
    }
    const parts = String(raw).split('-').map(Number);
    if (parts.length<3 || parts.some(isNaN)) return null;
    return { d: new Date(Date.UTC(parts[0], parts[1]-1, parts[2])), text:false, raw };
  }
  function isoOf(jsDate){ return jsDate.getFullYear()+'-'+String(jsDate.getMonth()+1).padStart(2,'0')+'-'+String(jsDate.getDate()).padStart(2,'0'); }
  function isoFromUTC(d){ return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
  function addDays(date, n){ const nd = new Date(date.getTime()); nd.setUTCDate(nd.getUTCDate()+n); return nd; }
  function firstOfMonth(date){ return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), 1)); }
  function eomonth(date){ return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth()+1, 0)); }
  function daysInMonth(date){ return eomonth(date).getUTCDate(); }
  function dayDiff(a,b){ return Math.round((a.getTime()-b.getTime())/86400000); }
  function excelMin(...args){ const v = args.filter(x=>x!==null && x!==undefined); return v.length? new Date(Math.min(...v.map(x=>x.getTime()))): null; }
  function excelMax(...args){ const v = args.filter(x=>x!==null && x!==undefined); return v.length? new Date(Math.max(...v.map(x=>x.getTime()))): null; }
  function fmtDateISO(iso){ if (!iso) return '—'; const p = parseCell(iso); if(!p) return '—'; return String(p.d.getUTCDate()).padStart(2,'0')+'/'+String(p.d.getUTCMonth()+1).padStart(2,'0')+'/'+p.d.getUTCFullYear(); }
  function periodoLabel(iso){
    const p = parseCell(iso); if(!p) return '—';
    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return `${meses[p.d.getUTCMonth()]} de ${p.d.getUTCFullYear()}`;
  }
  function rateTipoFromCategoria(cat){ return RIGIDO_CATS.includes(Number(cat)) ? 'RIGIDO' : 'TRAILER'; }

  /* ============================================================
     2. APPLICATION STATE — empty by default
  ============================================================ */
  let nextId = 1;
  function emptyData(){
    return { enf: [], acc: [], sage: {}, tablaBase: {}, periodoEnf: '', periodoAcc: '', nextId: 1 };
  }
  function loadState(){
    try{
      const raw = localStorage.getItem('panelIT_v2');
      if (raw){
        const parsed = JSON.parse(raw);
        if (parsed && parsed.enf && parsed.acc){ nextId = parsed.nextId || 1; return parsed; }
      }
    }catch(e){ /* storage unavailable */ }
    return emptyData();
  }
  function saveState(){
    try{ DATA.nextId = nextId; localStorage.setItem('panelIT_v2', JSON.stringify(DATA)); }catch(e){ /* best effort */ }
  }
  let DATA = loadState();

  function lookupSage(dni){ return DATA.sage[String(dni||'').trim()] || null; }
  function lookupBaseTabla(cat){ const v = DATA.tablaBase[String(cat)]; return (v===undefined)? null : v; }
  function hasData(){ return DATA.enf.length>0 || DATA.acc.length>0; }

  /* ============================================================
     3. LIVE CALCULATION (identical formulas to the Excel template)
  ============================================================ */
  function calcEnf(rec){
    const F = parseCell(rec.fechaInicio);
    const G = parseCell(rec.fechaFin);
    const out = { ok:false };
    if (!F){ out.errorMsg = 'Falta la fecha de inicio de la IT.'; return out; }
    if (isBlankOrError(rec.baseTabla)){ out.errorMsg = 'Falta la "Base tabla" para esta categoría. Introdúcela manualmente para poder calcular.'; return out; }
    if (!DATA.periodoEnf){ out.errorMsg = 'No hay periodo de cálculo cargado.'; return out; }

    const P1 = parseCell(DATA.periodoEnf).d;
    const EOM = eomonth(P1), FOM = firstOfMonth(P1);
    const rate = RATE_ANTIG[rateTipoFromCategoria(rec.categoria)];
    const antig = num(rec.antiguedad);
    const importeAntig = round2(antig*rate);
    const bc = (num(rec.baseTabla) + importeAntig + num(rec.complMensual)) / 30;

    const Fd = F.d, Gd = G ? G.d : null;
    const Fp2 = addDays(Fd,2), Fp3 = addDays(Fd,3), Fp14 = addDays(Fd,14);
    let P;
    if (Fd > EOM || (Gd && Gd < FOM)) P = 0;
    else P = Math.max(0, dayDiff(excelMin(Fp2, EOM, Gd || EOM), excelMax(Fd, FOM)) + 1);
    const Q = Math.max(0, dayDiff(excelMin(Fp14, EOM, Gd || EOM), excelMax(Fp3, FOM)) + 1);
    const S = Math.min(30, Math.max(0, dayDiff(excelMin(Gd, EOM), excelMax(Fd, FOM)) + 1));
    const R = S - P - Q;

    let U = null;
    if (!(Q===0 && R===0)) U = (bc*Q*0.75) + (bc*R) + (110/30)*S;
    const yaPagado = num(rec.yaPagado);
    let V = null;
    if (U!==null && (U - yaPagado) > 0) V = U - yaPagado;
    let W = null;
    if (!(Q===0 || V===null)) W = R===0 ? round2(V) : round2((V/(Q+R))*Q);
    let X = null;
    if (R!==0){ if (W===null) X = V===null? null : round2(V); else { const d=round2(V-W); X = d===0?null:d; } }
    let Y = null;
    if (Q===0 && R===0) Y = round2((110/30)*P);

    const total = round2((W||0)+(X||0)+(Y||0));
    out.ok = true;
    Object.assign(out, { antig, importeAntig, bc, P, Q, R, S, U, V, W, X, Y, total, yaPagado, gIsText: G? G.text: false });
    return out;
  }

  function calcAcc(rec){
    const F = parseCell(rec.fechaInicio);
    const G = parseCell(rec.fechaFin);
    const out = { ok:false };
    if (!F){ out.errorMsg = 'Falta la fecha de inicio de la IT.'; return out; }
    if (isBlankOrError(rec.baseTabla)){ out.errorMsg = 'Falta la "Base tabla" para esta categoría. Introdúcela manualmente para poder calcular.'; return out; }
    if (!DATA.periodoAcc){ out.errorMsg = 'No hay periodo de cálculo cargado.'; return out; }

    const P2 = parseCell(DATA.periodoAcc).d;
    const EOM = eomonth(P2), FOM = firstOfMonth(P2), dim = daysInMonth(P2);
    const jornada = num(rec.jornada);
    const bc = ((num(rec.baseTabla) + 0 + num(rec.vbles) + num(rec.incentivo) + num(rec.bolsaVac)) * jornada) / 100 / 30;

    const Fd = F.d, Gd = G? G.d : null;
    const end = Gd || EOM;
    const sameMonth = (Fd.getUTCFullYear()===P2.getUTCFullYear() && Fd.getUTCMonth()===P2.getUTCMonth());
    const adj = sameMonth ? 1 : 0;
    const raw = Math.max(0, dayDiff(excelMin(end, EOM), excelMax(Fd, FOM)) + 1 - adj);
    const P = (raw===dim) ? 30 : raw;
    const S = bc*P;
    const yaPagado = num(rec.yaPagado);
    const U = S - yaPagado;

    out.ok = true;
    Object.assign(out, { bc, P, S, U, yaPagado, gIsText: G? G.text: false });
    return out;
  }

  /* ============================================================
     4. EXCEL IMPORT (SheetJS) — reads the exact same layout as the
        official template: same sheet names, same column positions.
  ============================================================ */
  function cell(ws, addr){ const c = ws[addr]; if (!c || c.v===undefined) return null; if (c.t==='e') return (c.w || '#N/A'); return c.v; }
  function cellISO(ws, addr){
    const v = cell(ws, addr);
    if (v===null) return '';
    if (v instanceof Date) return isoOf(v);
    return v; // text-format date preserved as-is (bug detection relies on this)
  }
  function rowHasData(ws, addr){ return cell(ws, addr) !== null && cell(ws, addr) !== ''; }

  function findSheet(wb, name){
    const target = name.trim().toLowerCase();
    const found = wb.SheetNames.find(n => n.trim().toLowerCase() === target);
    return found ? wb.Sheets[found] : null;
  }

  function importWorkbook(wb){
    const report = { sheetsFound:[], sheetsMissing:[], enfCount:0, accCount:0, errors:[] };
    const wsCentro = findSheet(wb, SHEET_NAMES.centro);
    const wsSage = findSheet(wb, SHEET_NAMES.sage);
    const wsTabla = findSheet(wb, SHEET_NAMES.tablaBase);
    const wsCbe = findSheet(wb, SHEET_NAMES.cbe);
    const wsEnf = findSheet(wb, SHEET_NAMES.complEnf);
    const wsAcc = findSheet(wb, SHEET_NAMES.complAcc);
    for (const [key,ws] of Object.entries({centro:wsCentro,sage:wsSage,tablaBase:wsTabla,cbe:wsCbe,complEnf:wsEnf,complAcc:wsAcc})){
      (ws ? report.sheetsFound : report.sheetsMissing).push(SHEET_NAMES[key]);
    }
    if (!wsEnf && !wsAcc){
      report.errors.push('No se ha encontrado ninguna hoja "COMPL ENF" ni "COMPL ACC" en el archivo. Revisa que el Excel tenga la misma estructura que la plantilla.');
      return report;
    }

    const newData = emptyData();

    // --- SAGE (lookup) ---
    if (wsSage){
      let r = 6, empty = 0;
      while (empty < 15){
        const dni = cell(wsSage, 'E'+r);
        if (!dni){ empty++; r++; continue; }
        empty = 0;
        newData.sage[String(dni).trim()] = {
          nombre: cell(wsSage,'C'+r),
          categoria: cell(wsSage,'F'+r), antiguedad: cell(wsSage,'G'+r) || 0, jornada: cell(wsSage,'H'+r) || 0,
          adPersom: cell(wsSage,'I'+r) || 0, ayudaMinus: cell(wsSage,'J'+r) || 0, mega: cell(wsSage,'K'+r) || 0,
          pagoEnf: cell(wsSage,'L'+r) || 0, accidente: cell(wsSage,'M'+r) || 0,
          totalIT: cell(wsSage,'N'+r) || 0, totVbles: cell(wsSage,'O'+r) || 0,
        };
        r++;
      }
    }

    // --- TABLA BASE (categoría -> base "sin antigüedad") ---
    if (wsTabla){
      let r = 4, empty = 0;
      while (empty < 8){
        const cat = cell(wsTabla, 'S'+r);
        if (cat===null){ empty++; r++; continue; }
        empty = 0;
        newData.tablaBase[String(cat)] = cell(wsTabla,'T'+r);
        r++;
      }
    }

    // --- CENTRO ANALISIS (enrichment: delegación, subtipo, recaída, comentario) ---
    const centroByDni = {};
    if (wsCentro){
      let r = 2, empty = 0;
      while (empty < 15){
        const dni = cell(wsCentro,'D'+r);
        if (!dni){ empty++; r++; continue; }
        empty = 0;
        const d = String(dni).trim();
        if (!centroByDni[d]) centroByDni[d] = {
          delegacion: cell(wsCentro,'R'+r) || '', subtipoIT: cell(wsCentro,'M'+r) || 'Libre 1',
          recaida: cell(wsCentro,'O'+r) || 'No', comentario: cell(wsCentro,'U'+r) || '',
        };
        r++;
      }
    }

    // --- CALCULO BASE ENF (base inputs for Enfermedad) ---
    const cbeByDni = {};
    if (wsCbe){
      let r = 4, empty = 0;
      while (empty < 15){
        const dni = cell(wsCbe,'D'+r);
        if (!dni){ empty++; r++; continue; }
        empty = 0;
        cbeByDni[String(dni).trim()] = {
          categoria: cell(wsCbe,'J'+r), baseTabla: cell(wsCbe,'K'+r), complMensual: cell(wsCbe,'N'+r),
        };
        r++;
      }
    }

    // --- COMPL ENF ---
    if (wsEnf){
      newData.periodoEnf = cellISO(wsEnf, 'P1') || '';
      let r = 3, empty = 0;
      while (empty < 15){
        const dni = cell(wsEnf,'D'+r);
        if (!dni){ empty++; r++; continue; }
        empty = 0;
        const dniS = String(dni).trim();
        const cbe = cbeByDni[dniS] || {};
        const centro = centroByDni[dniS] || {};
        const sg = newData.sage[dniS];
        newData.enf.push({
          id: 'enf-'+(nextId++),
          cod: cell(wsEnf,'B'+r), dni: dniS, nombre: cell(wsEnf,'C'+r),
          subtipoIT: centro.subtipoIT || 'Libre 1', delegacion: centro.delegacion || '',
          recaida: centro.recaida || 'No', comentario: cell(wsEnf,'K'+r) || centro.comentario || '',
          fechaInicio: cellISO(wsEnf,'F'+r), fechaFin: cellISO(wsEnf,'G'+r) || '',
          categoria: isBlankOrError(cell(wsEnf,'M'+r)) ? (cbe.categoria||'') : cell(wsEnf,'M'+r),
          jornada: isBlankOrError(cell(wsEnf,'N'+r)) ? (sg?sg.jornada:100) : cell(wsEnf,'N'+r),
          antiguedad: sg ? (sg.antiguedad||0) : 0,
          baseTabla: isBlankOrError(cbe.baseTabla) ? '' : cbe.baseTabla,
          complMensual: isBlankOrError(cbe.complMensual) ? 0 : cbe.complMensual,
          yaPagado: isBlankOrError(cell(wsEnf,'T'+r)) ? 0 : cell(wsEnf,'T'+r),
        });
        r++;
      }
    }

    // --- COMPL ACC ---
    if (wsAcc){
      newData.periodoAcc = cellISO(wsAcc, 'P2') || '';
      let r = 4, empty = 0;
      while (empty < 15){
        const dni = cell(wsAcc,'D'+r);
        if (!dni){ empty++; r++; continue; }
        empty = 0;
        const dniS = String(dni).trim();
        const centro = centroByDni[dniS] || {};
        newData.acc.push({
          id: 'acc-'+(nextId++),
          cod: cell(wsAcc,'B'+r), dni: dniS, nombre: cell(wsAcc,'C'+r),
          delegacion: centro.delegacion || '', comentario: cell(wsAcc,'W'+r) || centro.comentario || '',
          fechaInicio: cellISO(wsAcc,'F'+r), fechaFin: cellISO(wsAcc,'G'+r) || '',
          categoria: isBlankOrError(cell(wsAcc,'M'+r)) ? '' : cell(wsAcc,'M'+r),
          jornada: isBlankOrError(cell(wsAcc,'H'+r)) ? 100 : cell(wsAcc,'H'+r),
          ayudaMinus: isBlankOrError(cell(wsAcc,'I'+r)) ? 0 : cell(wsAcc,'I'+r),
          vbles: isBlankOrError(cell(wsAcc,'J'+r)) ? 0 : cell(wsAcc,'J'+r),
          baseTabla: isBlankOrError(cell(wsAcc,'N'+r)) ? '' : cell(wsAcc,'N'+r),
          incentivo: cell(wsAcc,'Q'+r) || 110,
          bolsaVac: cell(wsAcc,'R'+r) || 0,
          yaPagado: isBlankOrError(cell(wsAcc,'T'+r)) ? 0 : cell(wsAcc,'T'+r),
        });
        r++;
      }
    }

    if (!newData.periodoEnf && newData.acc.length===0) newData.periodoEnf = isoFromUTC(new Date());
    if (!newData.periodoAcc) newData.periodoAcc = newData.periodoEnf;
    if (!newData.periodoEnf) newData.periodoEnf = newData.periodoAcc;

    report.enfCount = newData.enf.length;
    report.accCount = newData.acc.length;
    newData.nextId = nextId;
    DATA = newData;
    saveState();
    return report;
  }

  function setCell(ws, addr, value){ ws[addr] = { t: (value instanceof Date)?'d': (typeof value==='number'?'n':'s'), v: value }; }
  function dateOrNull(iso){ if(!iso) return null; const p = parseCell(iso); return p ? p.d : null; }

  /* ============================================================
     7. INCIDENCIAS
  ============================================================ */
  function buildIncidencias(){
    const incidencias = [];
    {
      const affected = []; let totalDelta=0;
      for (const r of DATA.acc){
        const c = calcAcc(r);
        if (c.ok && c.gIsText){
          const c2 = calcAcc({ ...r, fechaFin:'' });
          const delta = (c2.ok? c2.U : 0) - c.U;
          if (delta>0.005){ totalDelta+=delta; affected.push({dni:r.dni, nombre:r.nombre, detail:`fin registrado: ${r.fechaFin} · si se ignora: +${fmtMoney(delta)}`, delta}); }
        }
      }
      if (affected.length) incidencias.push({ sev:'high', titulo:'Fecha fin de accidente guardada como texto', detalle:`${affected.length} caso(s) tienen la fecha de fin en formato texto en el Excel importado.`, metric:fmtMoney(totalDelta), metricLabel:'sobrepago potencial evitado', affected:affected.sort((a,b)=>b.delta-a.delta) });
    }
    {
      const affected = [];
      for (const r of [...DATA.enf, ...DATA.acc]){ if (isBlankOrError(r.baseTabla)) affected.push({dni:r.dni, nombre:r.nombre, detail:`categoría ${r.categoria||'—'} sin base asignada`}); }
      if (affected.length) incidencias.push({ sev:'high', titulo:'Casos sin "Base tabla" asignada', detalle:'No se puede calcular su complemento hasta introducir la base manualmente en su ficha.', metric:String(affected.length), metricLabel:'casos bloqueados', affected });
    }
    return incidencias;
  }

  function renderIncidencias(){
    if (!hasData()){ return `<h2>Incidencias</h2><p class="lede">Importa datos primero para ver el resultado de la revisión.</p>${emptyPanel()}`; }

    if (!incidencias.length){ return `<h2>Incidencias</h2><p class="lede">No se ha detectado ninguna incidencia en los datos actuales.</p>`; }
    const sevIcon = { high:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.3 3.6L1.9 18a1.6 1.6 0 001.4 2.4h17.4a1.6 1.6 0 001.4-2.4L13.7 3.6a1.6 1.6 0 00-2.8 0z"/><path d="M12 9.4v4.2M12 16.8h.01"/></svg>` };
    return `
      <h2>Incidencias</h2>
      <p class="lede">Comprobación automática de los datos actuales. Se recalcula cada vez que editas un caso.</p>
      ${incidencias.map((inc,i)=>`
        <div class="inc-card">
          <div class="inc-head" onclick="APP.toggleInc(${i})">
            <div class="inc-sev ${inc.sev}">${sevIcon.high}</div>
            <div class="txt"><h4>${inc.titulo}</h4><p>${inc.detalle}</p></div>
            <div class="metric"><div class="n">${inc.metric}</div><div class="lbl2">${inc.metricLabel}</div></div>
            <svg class="chev" id="chev-${i}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          </div>
          ${inc.affected.length? `<div class="inc-body" id="incbody-${i}">${inc.affected.map(a=>`
            <div class="inc-row"><div class="who"><div class="nm">${esc(a.nombre)}</div><div class="meta">${esc(a.dni)} ${a.detail?'· '+esc(a.detail):''}</div></div></div>`).join('')}</div>` : ''}
        </div>
      `).join('')}
    `;
  }

  /* ============================================================
     8. FORM (editable ficha)
  ============================================================ */
  function blankRec(tipo){
    return tipo==='Enfermedad'
      ? { id:null, cod:'', dni:'', nombre:'', subtipoIT:'Libre 1', delegacion:'', recaida:'No', comentario:'', fechaInicio:'', fechaFin:'', categoria:'', jornada:100, antiguedad:0, baseTabla:'', complMensual:0, yaPagado:0 }
      : { id:null, cod:'', dni:'', nombre:'', delegacion:'', comentario:'', fechaInicio:'', fechaFin:'', categoria:'', jornada:100, ayudaMinus:0, vbles:0, baseTabla:'', incentivo:110, bolsaVac:0, yaPagado:0 };
  }

  function openForm(tipo, id){
    if (!DATA.periodoEnf && !DATA.periodoAcc){
      const today = isoFromUTC(new Date());
      DATA.periodoEnf = DATA.periodoEnf || today;
      DATA.periodoAcc = DATA.periodoAcc || today;
    }
    state.editing = { tipo, id, draft: id ? { ...findRec(tipo,id) } : blankRec(tipo) };
    document.getElementById('drawerName').textContent = id ? 'Editar caso' : 'Nuevo caso';
    document.getElementById('drawerDni').textContent = tipo==='Enfermedad' ? 'Complemento de Enfermedad' : 'Complemento de Accidente';
    renderForm();
    document.getElementById('drawer').classList.add('open');
    document.getElementById('scrim').classList.add('open');
  }
  function closeForm(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
    state.editing = null;
  }

  function persistDraft(){
    const { tipo, draft } = state.editing;
    const list = getList(tipo);
    if (state.editing.id){
      const idx = list.findIndex(r=>r.id===state.editing.id);
      if (idx>=0) list[idx] = { ...draft };
    } else if (draft.dni && draft.nombre && draft.fechaInicio){
      draft.id = (tipo==='Enfermedad'?'enf-':'acc-')+(nextId++);
      list.push(draft);
      state.editing.id = draft.id;
    }
    saveState();
    document.getElementById('navCountEnf').textContent = DATA.enf.length;
    document.getElementById('navCountAcc').textContent = DATA.acc.length;
  }

  function fieldHTML(cfg){
    const { key, label, type, value, hint, disabled } = cfg;
    const v = value===undefined||value===null? '' : value;
    if (type==='select'){
      return `<div class="field ${cfg.span2?'span2':''}"><label>${label}</label>
        <select data-key="${key}">${cfg.options.map(o=>`<option value="${esc(o)}" ${String(v)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>
        ${hint?`<span class="hint">${hint}</span>`:''}</div>`;
    }
    if (type==='textarea'){
      return `<div class="field span2"><label>${label}</label><textarea data-key="${key}">${esc(v)}</textarea></div>`;
    }
    return `<div class="field ${cfg.span2?'span2':''}"><label>${label}</label>
      <input data-key="${key}" type="${type||'text'}" ${type==='number'?'step="any"':''} value="${esc(v)}" ${disabled?'disabled':''} class="${type==='number'?'num-input':''}">
      ${hint?`<span class="hint">${hint}</span>`:''}</div>`;
  }

  function renderForm(){
    const { tipo, draft } = state.editing;
    const calc = tipo==='Enfermedad' ? calcEnf(draft) : calcAcc(draft);
    const sg = lookupSage(draft.dni);

    let resultHTML;
    if (!calc.ok){
      resultHTML = `<div class="err-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><div>${calc.errorMsg}</div></div>`;
    } else {
      const amt = tipo==='Enfermedad' ? calc.total : Math.max(0,calc.U);
      resultHTML = `<div class="result-banner ${amt>0.005?'':'muted'}"><span class="lbl">Complemento a pagar este periodo</span><span class="amt">${fmtMoney(amt)}</span></div>`;
      if (calc.gIsText){
        resultHTML += `<div class="warn-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.3 3.6L1.9 18a1.6 1.6 0 001.4 2.4h17.4a1.6 1.6 0 001.4-2.4L13.7 3.6a1.6 1.6 0 00-2.8 0z"/><path d="M12 9.4v4.2M12 16.8h.01"/></svg><div>La fecha fin se guardó como texto (${draft.fechaFin}). Aquí se interpreta correctamente para calcular el importe real.</div></div>`;
      }
    }

    let html = `<div class="live-result">${resultHTML}</div>`;

    html += `<div class="form-section"><div class="fs-title">Identificación</div><div class="form-grid">
      ${fieldHTML({key:'cod', label:'Código empleado', value:draft.cod})}
      <div class="field"><label>DNI</label><div class="lookup-row">
        <input data-key="dni" type="text" value="${esc(draft.dni)}" placeholder="DNI del empleado">
        <button class="btn btn-sm" id="btnLookup">Buscar</button>
      </div></div>
    </div>
    ${sg ? `<div class="badge-found"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Encontrado en SAGE: ${esc(sg.nombre)} · categoría ${sg.categoria} · jornada ${sg.jornada}%</div>`
         : draft.dni ? `<div class="badge-notfound"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg> No encontrado en SAGE — rellena categoría, jornada y base manualmente.</div>` : ''}
    <div class="form-grid" style="margin-top:10px;">
      ${fieldHTML({key:'nombre', label:'Nombre del empleado', value:draft.nombre, span2:true})}
    </div></div>`;

    html += `<div class="form-section"><div class="fs-title">Datos de la baja</div><div class="form-grid">
      ${fieldHTML({key:'fechaInicio', label:'Fecha inicio IT', type:'date', value:draft.fechaInicio})}
      ${fieldHTML({key:'fechaFin', label:'Fecha fin IT (vacío = en curso)', type:'date', value:draft.fechaFin})}
      ${tipo==='Enfermedad' ? fieldHTML({key:'subtipoIT', label:'Subtipo IT', type:'select', options:['Libre 1','Libre 2'], value:draft.subtipoIT}) : ''}
      ${tipo==='Enfermedad' ? fieldHTML({key:'recaida', label:'Recaída', type:'select', options:['No','Si'], value:draft.recaida}) : ''}
      ${fieldHTML({key:'delegacion', label:'Delegación', value:draft.delegacion})}
    </div>
    <div class="form-grid" style="margin-top:10px;">
      ${fieldHTML({key:'comentario', label:'Comentario', type:'textarea', value:draft.comentario})}
    </div></div>`;

    if (tipo==='Enfermedad'){
      html += `<div class="form-section"><div class="fs-title">Datos para el cálculo</div><div class="form-grid">
        ${fieldHTML({key:'categoria', label:'Categoría', type:'number', value:draft.categoria})}
        ${fieldHTML({key:'jornada', label:'% Jornada', type:'number', value:draft.jornada})}
        ${fieldHTML({key:'antiguedad', label:'Antigüedad (quinquenios)', type:'number', value:draft.antiguedad, hint:'Se usa '+(RATE_ANTIG[rateTipoFromCategoria(draft.categoria)])+' €/quinquenio según la categoría'})}
        ${fieldHTML({key:'baseTabla', label:'Base tabla (categoría)', type:'number', value:draft.baseTabla, hint: isBlankOrError(draft.baseTabla)? 'Sin valor — introdúcelo a mano':''})}
        ${fieldHTML({key:'complMensual', label:'Complemento mensual fijo', type:'number', value:draft.complMensual})}
        ${fieldHTML({key:'yaPagado', label:'Ya abonado en nómina (SAGE) este periodo', type:'number', value:draft.yaPagado})}
      </div></div>`;
      if (calc.ok){
        html += `<div class="form-section"><div class="fs-title">Resultado calculado</div>
          <div class="kv-line"><span class="k">BC diaria = (Base tabla + antigüedad + compl.) / 30</span><span class="v">${fmtMoney(calc.bc)}</span></div>
          <div class="kv-line"><span class="k">Tramo 1 · días 1-3</span><span class="v">${calc.P}</span></div>
          <div class="kv-line"><span class="k">Tramo 2 · días 4-15 (75% BC)</span><span class="v">${calc.Q}</span></div>
          <div class="kv-line"><span class="k">Tramo 3 · día 16+ (100% BC)</span><span class="v">${calc.R}</span></div>
          <div class="kv-line"><span class="k">Total teórico del periodo</span><span class="v">${calc.U===null?'—':fmtMoney(calc.U)}</span></div>
          <div class="kv-line" style="border-bottom:none;"><span class="k">− Ya abonado en nómina</span><span class="v">${fmtMoney(calc.yaPagado)}</span></div>
        </div>`;
      }
    } else {
      html += `<div class="form-section"><div class="fs-title">Datos para el cálculo</div><div class="form-grid">
        ${fieldHTML({key:'categoria', label:'Categoría', type:'number', value:draft.categoria})}
        ${fieldHTML({key:'jornada', label:'% Jornada', type:'number', value:draft.jornada})}
        ${fieldHTML({key:'baseTabla', label:'Base tabla (categoría)', type:'number', value:draft.baseTabla, hint: isBlankOrError(draft.baseTabla)? 'Sin valor — introdúcelo a mano':''})}
        ${fieldHTML({key:'vbles', label:'Variables (TOT VBLES)', type:'number', value:draft.vbles})}
        ${fieldHTML({key:'ayudaMinus', label:'Ayuda minusvalía', type:'number', value:draft.ayudaMinus})}
        ${fieldHTML({key:'incentivo', label:'Incentivo', type:'number', value:draft.incentivo})}
        ${fieldHTML({key:'bolsaVac', label:'Bolsa vacaciones', type:'number', value:draft.bolsaVac})}
        ${fieldHTML({key:'yaPagado', label:'Ya abonado en nómina (SAGE) este periodo', type:'number', value:draft.yaPagado})}
      </div></div>`;
      if (calc.ok){
        html += `<div class="form-section"><div class="fs-title">Resultado calculado</div>
          <div class="kv-line"><span class="k">BC diaria = (Base+Var.+Incentivo+Bolsa) × jornada% / 30</span><span class="v">${fmtMoney(calc.bc)}</span></div>
          <div class="kv-line"><span class="k">Días del periodo</span><span class="v">${calc.P}</span></div>
          <div class="kv-line"><span class="k">Total base del periodo (BC × días)</span><span class="v">${fmtMoney(calc.S)}</span></div>
          <div class="kv-line" style="border-bottom:none;"><span class="k">− Ya abonado en nómina</span><span class="v">${fmtMoney(calc.yaPagado)}</span></div>
        </div>`;
      }
    }

    document.getElementById('drawerBody').innerHTML = html;
    document.getElementById('drawerFoot').innerHTML = `
      ${state.editing.id ? '<button class="btn" id="btnDelete" style="color:var(--danger); border-color:var(--danger);">Eliminar</button>' : ''}
      <button class="btn btn-pdf" id="btnPdfFicha"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px;"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>Generar PDF</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="btnBack"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px;"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Volver atrás</button>
    `;

    document.getElementById('drawerBody').querySelectorAll('[data-key]').forEach(el=>{
      const evt = (el.tagName==='SELECT') ? 'change' : 'input';
      el.addEventListener(evt, ()=>{
        state.editing.draft[el.dataset.key] = el.value;
        persistDraft();
        const active = el.dataset.key;
        renderForm();
        const ne = document.querySelector(`#drawerBody [data-key="${active}"]`);
        if (ne){ ne.focus(); const v=ne.value; ne.value=''; ne.value=v; }
      });
    });
    const lookupBtn = document.getElementById('btnLookup');
    if (lookupBtn) lookupBtn.addEventListener('click', ()=>{
      const found = lookupSage(state.editing.draft.dni);
      if (found){
        Object.assign(state.editing.draft, { nombre: found.nombre || state.editing.draft.nombre, categoria: found.categoria, jornada: found.jornada });
        if (tipo==='Enfermedad'){
          state.editing.draft.antiguedad = found.antiguedad || 0;
          const bt = lookupBaseTabla(found.categoria); if (bt!==null) state.editing.draft.baseTabla = bt;
          state.editing.draft.yaPagado = found.totalIT || 0;
        } else {
          state.editing.draft.ayudaMinus = found.ayudaMinus || 0;
          state.editing.draft.vbles = found.totVbles || 0;
          const bt = lookupBaseTabla(found.categoria); if (bt!==null) state.editing.draft.baseTabla = bt;
          state.editing.draft.yaPagado = found.totalIT || 0;
        }
      }
      persistDraft();
      renderForm();
    });
    document.getElementById('btnPdfFicha').addEventListener('click', ()=>{
      generateEmployeePdf(state.editing.tipo, state.editing.draft);
    });
    document.getElementById('btnBack').addEventListener('click', ()=>{
      persistDraft();
      closeForm();
      render();
    });
    const delBtn = document.getElementById('btnDelete');
    if (delBtn) delBtn.addEventListener('click', ()=>{
      if (!confirm('¿Eliminar este caso? Esta acción no se puede deshacer.')) return;
      const { tipo, id } = state.editing;
      const list = getList(tipo);
      const idx = list.findIndex(r=>r.id===id);
      if (idx>=0) list.splice(idx,1);
      saveState(); closeForm(); render();
    });
  }

  /* ============================================================
     9. IMPORT / EXPORT UI WIRING
  ============================================================ */
  let downloadsCap = null;
  (async function initCapabilities(){
    try{ if (window.claude && window.claude.use) downloadsCap = await window.claude.use('downloads'); }catch(e){ downloadsCap = null; }
  })();

  function triggerImportDialog(){ document.getElementById('fileImport').click(); }

  function handleImportFile(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array', cellDates:true });
        const report = importWorkbook(wb);
        if (report.errors.length){
          alert(report.errors.join('\n'));
          return;
        }
        let msg = `Importado: ${report.enfCount} caso(s) de Enfermedad, ${report.accCount} de Accidente.`;
        if (report.sheetsMissing.length) msg += `\n\nHojas no encontradas (se ha continuado sin ellas): ${report.sheetsMissing.join(', ')}.`;
        alert(msg);
        state.view = 'enf'; state.search=''; state.filters={};
        render();
      }catch(err){
        alert('No se ha podido leer el archivo. Comprueba que es un .xlsx válido con la misma estructura que la plantilla.\n\n'+err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function handleExport(){
    if (!hasData()){ alert('No hay datos que exportar todavía.'); return; }
    const wb = buildExportWorkbook();
    const arrbuf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    const blob = new Blob([arrbuf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const filename = `Complementos-IT-${(DATA.periodoEnf||DATA.periodoAcc||'').slice(0,7)||'export'}.xlsx`;
    if (!downloadsCap){
      try{ downloadsCap = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ downloadsCap = null; }
    }
    if (downloadsCap){
      try{
        await downloadsCap.save({ filename, data: blob });
      }catch(err){
        if (err && err.code==='declined') return;
        alert('No se ha podido generar la descarga ('+(err&&err.code||'error')+'). Inténtalo de nuevo.');
      }
    } else {
      // Fallback (e.g. preview/dev context without the capability): trigger a normal browser download.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }
  }

  /* ============================================================
     9b. PDF GENERATION (jsPDF + autoTable) — mirrors the same
         field order and grouping used in the Excel template.
  ============================================================ */
  function pdfHeaderColors(){ return { brand:[15,107,92], ink:[18,24,31], muted:[91,101,112], line:[222,226,220] }; }

  function kvTable(doc, y, title, pairs, colors){
    doc.setFontSize(9.5); doc.setTextColor(...colors.muted); doc.setFont(undefined,'bold');
    doc.text(title.toUpperCase(), 14, y);
    doc.autoTable({
      startY: y+3, margin:{left:14, right:14}, theme:'plain', tableWidth:182,
      styles:{ fontSize:9.5, cellPadding:{top:3,bottom:3,left:0,right:4}, textColor:colors.ink, lineWidth:0 },
      columnStyles:{ 0:{ cellWidth:70, textColor:colors.muted }, 1:{ cellWidth:112, fontStyle:'bold' } },
      alternateRowStyles:{ fillColor:[246,247,243] },
      body: pairs.map(([k,v])=>[k, v==null||v===''?'—':String(v)]),
    });
    return doc.lastAutoTable.finalY + 8;
  }

  function resultBanner(doc, y, label, amount, colors){
    const positive = amount>0.005;
    const fill = positive ? [228,240,236] : [235,237,232];
    const text = positive ? colors.brand : colors.muted;
    doc.setFillColor(...fill);
    doc.roundedRect(14, y, 182, 16, 2, 2, 'F');
    doc.setFontSize(9.5); doc.setTextColor(...text); doc.setFont(undefined,'bold');
    doc.text(label, 19, y+10);
    doc.setFontSize(13);
    doc.text(fmtMoney(amount), 191, y+10, { align:'right' });
    doc.setFont(undefined,'normal');
    return y + 24;
  }

  function addEmployeeBlock(doc, tipo, rec, startY){
    const colors = pdfHeaderColors();
    const calc = tipo==='Enfermedad' ? calcEnf(rec) : calcAcc(rec);
    let y = startY;

    doc.setFontSize(14); doc.setTextColor(...colors.ink); doc.setFont(undefined,'bold');
    doc.text(rec.nombre || '(sin nombre)', 14, y);
    doc.setFont(undefined,'normal'); doc.setFontSize(9.5); doc.setTextColor(...colors.muted);
    doc.text(`DNI ${rec.dni||'—'}   ·   Complemento de ${tipo}   ·   Periodo ${periodoLabel(tipo==='Enfermedad'?DATA.periodoEnf:DATA.periodoAcc)}`, 14, y+6);
    y += 14;

    const bajaPairs = tipo==='Enfermedad'
      ? [['Código empleado', rec.cod], ['Delegación', rec.delegacion], ['Subtipo IT', rec.subtipoIT], ['Fecha inicio IT', fmtDateISO(rec.fechaInicio)], ['Fecha fin IT', rec.fechaFin? fmtDateISO(rec.fechaFin) : 'en curso'], ['Recaída', rec.recaida], ['Comentario', rec.comentario]]
      : [['Código empleado', rec.cod], ['Delegación', rec.delegacion], ['Fecha inicio', fmtDateISO(rec.fechaInicio)], ['Fecha fin', rec.fechaFin? fmtDateISO(rec.fechaFin) : 'en curso'], ['Comentario', rec.comentario]];
    y = kvTable(doc, y, 'Datos de la baja', bajaPairs, colors);

    const calcPairs = tipo==='Enfermedad'
      ? [['Categoría', rec.categoria], ['% Jornada', fmtNum(rec.jornada)+'%'], ['Antigüedad (quinquenios)', fmtNum(calc.ok?calc.antig:rec.antiguedad)], ['Base tabla', isBlankOrError(rec.baseTabla)?'— (sin asignar)':fmtMoney(num(rec.baseTabla))], ['Complemento mensual fijo', fmtMoney(num(rec.complMensual))], ['Ya abonado en nómina (SAGE)', fmtMoney(num(rec.yaPagado))]]
      : [['Categoría', rec.categoria], ['% Jornada', fmtNum(rec.jornada)+'%'], ['Base tabla', isBlankOrError(rec.baseTabla)?'— (sin asignar)':fmtMoney(num(rec.baseTabla))], ['Variables (TOT VBLES)', fmtMoney(num(rec.vbles))], ['Ayuda minusvalía', fmtMoney(num(rec.ayudaMinus))], ['Incentivo', fmtMoney(num(rec.incentivo))], ['Bolsa vacaciones', fmtMoney(num(rec.bolsaVac))], ['Ya abonado en nómina (SAGE)', fmtMoney(num(rec.yaPagado))]];
    y = kvTable(doc, y, 'Datos para el cálculo', calcPairs, colors);

    if (!calc.ok){
      doc.setFillColor(251,234,232); doc.roundedRect(14, y, 182, 14, 2, 2, 'F');
      doc.setFontSize(9); doc.setTextColor(179,38,30);
      doc.text('Incidencia: ' + calc.errorMsg, 19, y+9, { maxWidth:172 });
      return y + 22;
    }

    const resPairs = tipo==='Enfermedad'
      ? [['BC diaria', fmtMoney(calc.bc)], ['Tramo 1 · días 1-3', calc.P], ['Tramo 2 · días 4-15 (75% BC)', calc.Q], ['Tramo 3 · día 16+ (100% BC)', calc.R], ['Total teórico del periodo', calc.U===null?'—':fmtMoney(calc.U)], ['Ya abonado en nómina', fmtMoney(calc.yaPagado)]]
      : [['BC diaria', fmtMoney(calc.bc)], ['Días del periodo', calc.P], ['Total base del periodo (BC × días)', fmtMoney(calc.S)], ['Ya abonado en nómina', fmtMoney(calc.yaPagado)]];
    y = kvTable(doc, y, 'Resultado del cálculo', resPairs, colors);

    const amt = tipo==='Enfermedad' ? calc.total : Math.max(0, calc.U);
    y = resultBanner(doc, y, 'Complemento a pagar este periodo', amt, colors);
    return y;
  }

  function pdfDoc(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:'a4' });
    doc.setFont('helvetica');
    whitePage(doc);
    return doc;
  }
  function whitePage(doc){
    doc.setFillColor(255,255,255);
    doc.rect(0, 0, 210, 297, 'F');
  }

  function savePdf(doc, filename){
    const blob = doc.output('blob');
    if (downloadsCap){
      downloadsCap.save({ filename, data: blob }).catch(err=>{
        if (err && err.code==='declined') return;
        alert('No se ha podido generar la descarga del PDF ('+(err&&err.code||'error')+').');
      });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }
  }

  function generateEmployeePdf(tipo, rec){
    if (!window.jspdf){ alert('La librería de generación de PDF no se ha cargado todavía. Inténtalo de nuevo en unos segundos.'); return; }
    const doc = pdfDoc();
    addEmployeeBlock(doc, tipo, rec, 20);
    const safeName = (rec.nombre||'empleado').replace(/[^\p{L}\p{N} ]/gu,'').trim().replace(/\s+/g,'-');
    savePdf(doc, `Complemento-${tipo}-${safeName||rec.dni}.pdf`);
  }

  function pageFooter(doc, colors, pageNum, total){
    doc.setDrawColor(...colors.line); doc.setLineWidth(0.2);
    doc.line(14, 283, 196, 283);
    doc.setFontSize(8); doc.setFont(undefined,'normal'); doc.setTextColor(...colors.muted);
    doc.text('Panel de Complementos IT', 14, 289);
    doc.text(`Página ${pageNum} de ${total}`, 196, 289, { align:'right' });
  }

  function generateMassPdf(tipo, records){
    if (!window.jspdf){ alert('La librería de generación de PDF no se ha cargado todavía. Inténtalo de nuevo en unos segundos.'); return; }
    const doc = pdfDoc();
    const colors = pdfHeaderColors();
    records.forEach((rec, i)=>{
      if (i>0){ doc.addPage(); whitePage(doc); }
      addEmployeeBlock(doc, tipo, rec, 20);
      pageFooter(doc, colors, i+1, records.length);
    });
    const periodo = (tipo==='Enfermedad'?DATA.periodoEnf:DATA.periodoAcc)||'';
    savePdf(doc, `Complementos-${tipo}-${records.length}-empleados-${periodo.slice(0,7)}.pdf`);
  }


  const titles = { landing:'Complementos IT', enf:'Complemento · Enfermedad', acc:'Complemento · Accidente', incidencias:'Incidencias' };

  function render(){
    document.getElementById('viewTitle').textContent = titles[state.view] || 'Complementos IT';
    const showTopExtras = state.view!=='landing';
    document.getElementById('periodChip').style.display = (showTopExtras && hasData()) ? '' : 'none';
    document.getElementById('searchWrap').style.display = (state.view==='enf'||state.view==='acc') ? '' : 'none';
    if (hasData()) document.getElementById('periodChip').textContent = 'Periodo: ' + periodoLabel(DATA.periodoEnf || DATA.periodoAcc);

    const root = document.getElementById('viewRoot');
    if (state.view==='landing') root.innerHTML = renderLanding();
    else if (state.view==='enf') root.innerHTML = renderEnfGrid();
    else if (state.view==='acc') root.innerHTML = renderAccGrid();
    else if (state.view==='incidencias') root.innerHTML = renderIncidencias();

    document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
    document.getElementById('navCountEnf').textContent = DATA.enf.length;
    document.getElementById('navCountAcc').textContent = DATA.acc.length;
    document.getElementById('navCountInc').textContent = hasData() ? buildIncidencias().length : 0;

    root.querySelectorAll('tbody tr[data-id]').forEach(tr=>{ tr.addEventListener('click', ()=> openForm(tr.dataset.tipo, tr.dataset.id)); });
    root.querySelectorAll('input.row-check').forEach(cb=>{
      cb.addEventListener('click', e=>e.stopPropagation());
      cb.addEventListener('change', e=>{
        const tipo = cb.dataset.tipo, id = cb.dataset.id;
        if (cb.checked) state.selected[tipo].add(id); else state.selected[tipo].delete(id);
        render();
      });
    });
    const selAllEnf = document.getElementById('selAllEnf');
    if (selAllEnf) selAllEnf.addEventListener('change', ()=>{
      const ids = [...root.querySelectorAll('tbody tr[data-tipo="Enfermedad"]')].map(tr=>tr.dataset.id);
      if (selAllEnf.checked) ids.forEach(id=>state.selected.Enfermedad.add(id));
      else ids.forEach(id=>state.selected.Enfermedad.delete(id));
      render();
    });
    const selAllAcc = document.getElementById('selAllAcc');
    if (selAllAcc) selAllAcc.addEventListener('change', ()=>{
      const ids = [...root.querySelectorAll('tbody tr[data-tipo="Accidente"]')].map(tr=>tr.dataset.id);
      if (selAllAcc.checked) ids.forEach(id=>state.selected.Accidente.add(id));
      else ids.forEach(id=>state.selected.Accidente.delete(id));
      render();
    });
    const btnPdfEnf = document.getElementById('btnPdfEnf'); if (btnPdfEnf) btnPdfEnf.addEventListener('click', ()=>{
      const recs = DATA.enf.filter(r=>state.selected.Enfermedad.has(r.id));
      if (recs.length) generateMassPdf('Enfermedad', recs);
    });
    const btnPdfAcc = document.getElementById('btnPdfAcc'); if (btnPdfAcc) btnPdfAcc.addEventListener('click', ()=>{
      const recs = DATA.acc.filter(r=>state.selected.Accidente.has(r.id));
      if (recs.length) generateMassPdf('Accidente', recs);
    });
    const s1=document.getElementById('fEnfSearch'); if(s1) s1.addEventListener('input', e=>{ state.search=e.target.value; render(); focusSearch(); });
    const s2=document.getElementById('fAccSearch'); if(s2) s2.addEventListener('input', e=>{ state.search=e.target.value; render(); focusSearch(); });
    const d1=document.getElementById('fEnfDeleg'); if(d1) d1.addEventListener('change', e=>{ state.filters.deleg=e.target.value; render(); });
    const d2=document.getElementById('fAccDeleg'); if(d2) d2.addEventListener('change', e=>{ state.filters.deleg=e.target.value; render(); });
    const e1=document.getElementById('fEnfEstado'); if(e1) e1.addEventListener('change', e=>{ state.filters.estado=e.target.value; render(); });
    const e2=document.getElementById('fAccEstado'); if(e2) e2.addEventListener('change', e=>{ state.filters.estado=e.target.value; render(); });
    const bn1=document.getElementById('btnNewEnf'); if(bn1) bn1.addEventListener('click', ()=>openForm('Enfermedad', null));
    const bn2=document.getElementById('btnNewAcc'); if(bn2) bn2.addEventListener('click', ()=>openForm('Accidente', null));
    const bExp=document.getElementById('btnExportLanding'); if(bExp) bExp.addEventListener('click', ()=>{ if(hasData()) handleExport(); });
  }
  function focusSearch(){
    const id = state.view==='enf' ? 'fEnfSearch' : 'fAccSearch';
    const el = document.getElementById(id);
    if (el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
  }

  window.APP = {
    goto(view){ state.view=view; state.search=''; state.filters={}; render(); window.scrollTo(0,0); },
    toggleInc(i){ document.getElementById('incbody-'+i).classList.toggle('open'); document.getElementById('chev-'+i).classList.toggle('open'); }
  };

  document.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{ APP.goto(btn.dataset.view); document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrimSidebar').classList.remove('open'); });
  });
  document.getElementById('globalSearch').addEventListener('input', e=>{ state.search = e.target.value; render(); });
  document.getElementById('drawerClose').addEventListener('click', ()=>{ if(state.editing) persistDraft(); closeForm(); render(); });
  document.getElementById('scrim').addEventListener('click', ()=>{ if(state.editing) persistDraft(); closeForm(); render(); });
  document.getElementById('menuBtn').addEventListener('click', ()=>{ document.getElementById('sidebar').classList.add('open'); document.getElementById('scrimSidebar').classList.add('open'); });
  document.getElementById('scrimSidebar').addEventListener('click', ()=>{ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrimSidebar').classList.remove('open'); });
  document.getElementById('btnExportTop').addEventListener('click', handleExport);
  document.getElementById('fileImport').addEventListener('change', (e)=>{ handleImportFile(e.target.files[0]); e.target.value=''; });

  document.getElementById('navCountEnf').textContent = DATA.enf.length;
  document.getElementById('navCountAcc').textContent = DATA.acc.length;
  document.getElementById('navCountInc').textContent = hasData() ? buildIncidencias().length : 0;

  state.view = hasData() ? 'enf' : 'landing';
  render();
})();

</script>
</body>
</html>
